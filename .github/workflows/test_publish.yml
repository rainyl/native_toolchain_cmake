name: test + publish + release

on:
  # Pushes to branches are covered by the pull_request event; running both
  # would execute the whole matrix twice per push.
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"

# A new push to the same branch makes the previous run obsolete: cancel it
# instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EMSDK_VERSION: 7.0.0
  NDK_VERSION: r29
  EM_CACHE_FOLDER: emsdk-cache
  APT_PKGS_VERSION: "1.0"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: analyze
        run: dart analyze
      # Catches packaging problems (missing files, stale CHANGELOG version)
      # before a tag is pushed, not while publishing it.
      - name: validate the package
        run: dart pub publish --dry-run

  # One definition for every host OS: the steps only differ in how ninja and
  # the cross compilers are installed. Ninja ships with the Windows and macOS
  # images, only Linux has to install it.
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: setup emsdk
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      - name: verify emsdk
        run: emcc --version
      - name: setup (linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-i686-linux-gnu gcc-riscv64-linux-gnu ninja-build
          version: ${{ env.APT_PKGS_VERSION }}
      - name: setup (macos)
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja
      - name: setup ndk
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          local-cache: true
      # The package is pure Dart: `dart test` needs a Dart SDK, not Flutter.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: test
        run: dart test

  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: setup emsdk
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      - name: verify emsdk
        run: emcc --version
      - name: setup
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build
          version: ${{ env.APT_PKGS_VERSION }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
      - name: expose Chrome
        run: echo "CHROME_EXECUTABLE=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Chrome integration test
        env:
          DNTCM_REQUIRE_CHROME: "1"
        run: dart test test/web/chrome_integration_test.dart -r expanded

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze, test, chrome]
    permissions:
      id-token: write # Required for authentication using OIDC
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pub.dev
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      # A tag that disagrees with pubspec.yaml would publish the wrong version.
      - name: Check the tag matches the pubspec version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version: *//p' pubspec.yaml | head -n1)"
          echo "tag=$tag pubspec=$version"
          test "$tag" = "$version"
      - name: Validate the package
        run: dart pub publish --dry-run
      - name: Publish
        run: dart pub publish --force

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    permissions:
      contents: write # https://github.com/softprops/action-gh-release/issues/236
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
