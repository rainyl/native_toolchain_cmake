name: test + publish + release

on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
    # tags:
    #   - 'v[0-9]+.[0-9]+.[0-9]+*' # tag pattern on pub.dev: 'v{{version}'
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - name: verify emsdk
        run: emcc --version
      - name: setup
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf gcc-i686-linux-gnu \
            gcc-riscv64-linux-gnu ninja-build
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: test
        run: |
          cd "${{github.workspace}}"
          dart test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - name: verify emsdk
        run: emcc --version
      - name: setup
        run: |
          choco install ninja
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: test
        run: |
          cd "${{github.workspace}}"
          dart test
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - name: verify emsdk
        run: emcc --version
      - name: setup
        run: |
          brew install ninja
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: test
        run: |
          cd "${{github.workspace}}"
          dart test
  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Publish
        run: dart pub publish --force

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    permissions:
      contents: write # https://github.com/softprops/action-gh-release/issues/236
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true

  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - name: verify emsdk
        run: emcc --version
      - name: setup
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: expose Chrome
        run: echo "CHROME_EXECUTABLE=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: install dependencies
        run: dart pub get
      - name: Chrome integration test
        env:
          NTC_REQUIRE_CHROME: "1"
        run: dart test test/web/chrome_integration_test.dart -r expanded
