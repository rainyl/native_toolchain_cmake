name: Example
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "lib/**"
      - "cmake/**"
      - "example/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/examples.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "cmake/**"
      - "example/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/examples.yaml"

# Six full Flutter builds are expensive: superseded runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EMSDK_VERSION: 7.0.0
  NDK_VERSION: r29
  EM_CACHE_FOLDER: emsdk-cache
  APT_PKGS_VERSION: "1.0"

jobs:
  # The desktop targets only differ in the Flutter platform they build.
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            target: windows
          - name: linux
            os: ubuntu-latest
            target: linux
          - name: macos
            os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: setup (linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-i686-linux-gnu gcc-riscv64-linux-gnu ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          version: ${{ env.APT_PKGS_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: run dart-cli example
        working-directory: example/dart_cli
        run: dart run
      - name: run flutter example
        working-directory: example/flutter
        run: flutter build ${{ matrix.target }} --release

  ios:
    name: ios
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true
      - name: flutter example
        working-directory: example/flutter
        run: |
          flutter config --enable-native-assets
          flutter build ios --release --no-codesign

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: setup
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-i686-linux-gnu gcc-riscv64-linux-gnu ninja-build
          version: ${{ env.APT_PKGS_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
      - name: setup ndk
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          local-cache: true
      - name: flutter example
        working-directory: example/flutter
        run: flutter build apk --release

  web:
    name: web (master)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      - name: verify emsdk
        run: emcc --version
      - name: setup
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ninja-build
          version: ${{ env.APT_PKGS_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true
      - name: enable data assets
        run: flutter config --enable-dart-data-assets
      - name: flutter web (dart2js)
        working-directory: example/flutter
        run: |
          flutter build web --release
          find build/web/assets/packages/add -type f | sort
          test -n "$(find build/web/assets/packages/add -name 'add*.wasm')"
          test -n "$(find build/web/assets/packages/add -name 'add*.js')"
      - name: flutter web (dart2wasm)
        working-directory: example/flutter
        run: |
          flutter build web --wasm --release
          find build/web/assets/packages/add -type f | sort
          test -n "$(find build/web/assets/packages/add -name 'add*.wasm')"
