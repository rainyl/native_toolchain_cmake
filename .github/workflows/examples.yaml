name: Example
on:
  push:
    paths:
      - "lib/**"
      - "cmake/**"
      - "example/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/examples.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "cmake/**"
      - "example/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/examples.yaml"

# Six full Flutter builds are expensive: superseded runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 7.0.0
  NDK_VERSION: r29

jobs:
  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: run dart-cli example
        working-directory: example/dart_cli
        run: dart run
      - name: run flutter example
        working-directory: example/flutter
        run: flutter build windows --release
  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf gcc-i686-linux-gnu \
            gcc-riscv64-linux-gnu ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: run dart-cli example
        working-directory: example/dart_cli
        run: dart run
      - name: run flutter example
        working-directory: example/flutter
        run: flutter build linux --release
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: run dart-cli example
        working-directory: example/dart_cli
        run: dart run
      - name: run flutter example
        working-directory: example/flutter
        run: flutter build macos --release
  ios:
    name: ios
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true
      - name: flutter example
        working-directory: example/flutter
        run: |
          flutter config --enable-native-assets
          flutter build ios --release --no-codesign
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf gcc-i686-linux-gnu \
            gcc-riscv64-linux-gnu ninja-build
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
      - name: flutter example
        working-directory: example/flutter
        run: flutter build apk --release

  web:
    name: web (master)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: verify emsdk
        run: emcc --version
      - name: setup
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: subosito/flutter-action@v2
        with:
          channel: "master"
          cache: true
      - name: enable data assets
        run: flutter config --enable-dart-data-assets
      - name: flutter web (dart2js)
        working-directory: example/flutter
        run: |
          flutter build web --release
          find build/web/assets/packages/add -type f | sort
          test -n "$(find build/web/assets/packages/add -name 'add*.wasm')"
          test -n "$(find build/web/assets/packages/add -name 'add*.js')"
      - name: flutter web (dart2wasm)
        working-directory: example/flutter
        run: |
          flutter build web --wasm --release
          find build/web/assets/packages/add -type f | sort
          test -n "$(find build/web/assets/packages/add -name 'add*.wasm')"
